name: Saints And Miracles Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret_scan:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secret Scanning
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Preparação
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Dependências
      - name: Install npm dependencies
        run: npm ci

      - name: Restore .NET dependencies
        run: dotnet restore SaintsAndMiracles.sln

      # SCA nativo
      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run NuGet vulnerability audit
        run: dotnet list SaintsAndMiracles.sln package --vulnerable --include-transitive

      # SCA with Snyk
      - name: Install Snyk CLI
        run: npm install --global snyk

      - name: Run Snyk SCA
        run: snyk test --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # SAST with SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
