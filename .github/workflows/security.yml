name: Saints And Miracles Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secret Scanning
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Preparação
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Dependências Angular
      - name: Install npm dependencies
        #working-directory: Client
        run: npm ci

      # Dependências .NET
      - name: Restore .NET dependencies
        run: dotnet restore SaintsAndMiracles.sln

      # SCA native
      - name: Run npm audit
        working-directory: Client
        run: npm audit --audit-level=high

      - name: Run NuGet vulnerability audit
        run: dotnet list SaintsAndMiracles.sln package --vulnerable --include-transitive

      # SCA with Snyk
      - name: Install Snyk CLI
        run: npm install --global snyk

      - name: Run Snyk SCA
        run: snyk test --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # SAST - SonarQube Cloud (.NET)
      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarScanner Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"davidfreitas51_SaintsAndMiracles" \
            /o:"davidfreitas51" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.scanner.scanAll=true

      - name: Build solution
        run: dotnet build SaintsAndMiracles.sln --configuration Release --no-restore

      - name: SonarScanner End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="$SONAR_TOKEN"
